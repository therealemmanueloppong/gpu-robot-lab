[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-robot-lab"
version = "0.1.0"
description = "GPU kernels written from scratch and benchmarked against PyTorch, then used to speed up a simulated robot."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Google Colab already has torch and triton installed, so you usually do not need this extra there.
gpu = ["torch", "triton"]
plot = ["matplotlib"]
sim = ["mujoco", "mujoco-mjx", "jax"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
